name: Publish SDK cache

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdk-cache
  cancel-in-progress: false

jobs:
  publish:
    name: Publish robot SDK
    runs-on:
      - self-hosted
      - v3
    container:
      image: ghcr.io/hulks/hulk-ci:1.100
      options: --user=1000:1000
      volumes:
        - hulk-nix:/nix
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Publish SDK cache
        shell: nix develop .#default --accept-flake-config --no-update-lock-file --command bash -eo pipefail "{0}"
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_PUBLISH_TOKEN }}
        run: ./pepsi sdk push-cache
