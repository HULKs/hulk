name: Publish Nix cache

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nix-cache
  cancel-in-progress: false

jobs:
  publish:
    name: Publish flake outputs
    runs-on:
      - self-hosted
      - v3
    container:
      image: ghcr.io/hulks/hulk-ci:1.100
      options: --user=1000:1000
      volumes:
        - hulk-nix:/nix
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Publish flake outputs
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_PUBLISH_TOKEN }}
        run: nix run --accept-flake-config --no-update-lock-file .#pepsi -- cache push
