name: Rust
on:
  pull_request:
  merge_group:
    types: [checks_requested]
defaults:
  run:
    shell: nix develop .#default --no-update-lock-file --command bash -eo pipefail "{0}"
env:
  CARGO_HOME: /__w/hulk/cargo
  CARGO_TARGET_DIR: /__w/hulk/target
  CARGO_TERM_COLOR: always
  HULK_DATA_HOME: /__w/hulk/data

jobs:
  check:
    name: Check with clippy
    runs-on:
      - self-hosted
      - v3
    container:
      image: ghcr.io/hulks/hulk-ci:1.100
      options: --user=1000:1000
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check
        run: ./pepsi clippy --locked . -- --deny warnings

  check-cargo-lock:
    name: Check Cargo.lock
    strategy:
      matrix:
        path:
          - .
    runs-on:
      - self-hosted
      - v3
    container:
      image: ghcr.io/hulks/hulk-ci:1.100
      options: --user=1000:1000
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check
        run: cargo update --locked --workspace --manifest-path ${{ matrix.path }}/Cargo.toml

  format:
    name: Format
    runs-on:
      - self-hosted
      - v3
    container:
      image: ghcr.io/hulks/hulk-ci:1.100
      options: --user=1000:1000
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check
        run: ./pepsi fmt --check

  test:
    name: Test
    runs-on:
      - self-hosted
      - v3
    container:
      image: ghcr.io/hulks/hulk-ci:1.100
      options: --user=1000:1000
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Test
        run: ./pepsi nextest
      - name: Doctests
        run: ./pepsi test --doc

  build_tools:
    name: Build
    strategy:
      matrix:
        tool:
          - pepsi
          - twix
    runs-on:
      - self-hosted
      - v3
    container:
      image: ghcr.io/hulks/hulk-ci:1.100
      options: --user=1000:1000
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build
        run: ./pepsi build --locked --release ${{ matrix.tool }}

  build_pepsi_android:
    name: Build pepsi for Android
    runs-on:
      - self-hosted
      - v3
    container:
      image: ghcr.io/hulks/hulk-ci:1.100
      options: --user=1000:1000
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: nix develop .#android --no-update-lock-file --command bash -eo pipefail "{0}"
        run: cargo build --locked --release --target aarch64-linux-android -p pepsi

  build_mkdocs:
    name: Build mkdocs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install mkdocs
        run: pip install mkdocs-material
      - name: Build docs
        run: mkdocs build --strict
