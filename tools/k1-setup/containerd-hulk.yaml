    keepalive: true
    max_boot_retry: 3
    cpu_cores: "0,1,2,3"
    deps: []

  - name: booster.shell
    enable: true
    container: motion
    exe: /opt/booster/bin/container/cli_wrapper
    args: '/opt/booster/bin/script/booster_shell_boot --log-dir /var/log/booster/booster_shell'
    envs: {}
    cwd: /opt/booster/BoosterShell
    user: root
    keepalive: true
    max_boot_retry: 3
    cpu_cores: "0,1,2,3"
    deps: []

  - name: rtc_client
    enable: false
    container: perception
    exe: /opt/booster/bin/container/rtc_client
    args: ""
    envs:
      FASTRTPS_DEFAULT_PROFILES_FILE: /opt/booster/config/dds_configs/${dds_config}/fastdds_profile_udp_only.xml
