      - audio

  - name: ros.booster.vision_detection
    enable: false
    container: perception
    exe: /opt/booster/bin/container/cli_wrapper
    args: 'bash -c "source install/setup.bash && source src/detection/person_face/bin/activate && python3 src/detection/yolo_detection.py --robot_model ${robot_model}"'
    envs:
      LD_LIBRARY_PATH: /opt/booster/BoosterFaceDetection/src/detection/person_face/lib/python3.10/site-packages/torch/lib
      FASTRTPS_DEFAULT_PROFILES_FILE: /opt/booster/config/dds_configs/${dds_config}/fastdds_profile.xml
    cwd: /opt/booster/BoosterFaceDetection
    user: booster
    keepalive: true
    max_boot_retry: 3
    cpu_cores: "0,1,2,3"
    deps: []

  - name: ros.booster.auto_handeye_calib
    enable: true
    container: perception
    exe: /opt/booster/bin/container/cli_wrapper
    args: 'bash -c "source install/setup.bash && install/auto_handeye_calib/lib/auto_handeye_calib/ros_service_node_venv.sh --urdf_name ${urdf_name} --ros-args -p output_root:=/var/log/booster/auto_handeye_calib_runs -p publish_feedback:=true -p feedback_topic:=/handeye_calib/feedback/image -p image_topic:=/boostercamera/head/rgb -p camera_info_topic:=/boostercamera/head/rgb/camera_info -p use_camera_info:=true"'
    envs:
      AUTO_HANDEYE_CALIB_VENV: /opt/booster/BoosterAutoHandeyeCalib/install/auto_handeye_calib/share/auto_handeye_calib/handeye_calib
      FASTRTPS_DEFAULT_PROFILES_FILE: /opt/booster/config/dds_configs/${dds_config}/fastdds_profile_udp_only.xml
    cwd: /opt/booster/BoosterAutoHandeyeCalib
    user: root
    keepalive: true
    max_boot_retry: 3
    cpu_cores: "0,1,2,3"
    deps: []

  - name: rs_message
    enable: true
    container: motion
    exe: /opt/booster/bin/container/rs_message
    args: '-autoPowerOnFlag 1'
    envs:
      FASTRTPS_DEFAULT_PROFILES_FILE: /opt/booster/config/dds_configs/${dds_config}/fastdds_profile_udp_only.xml
    cwd: /
    user: root
