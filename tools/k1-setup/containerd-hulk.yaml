# Booster containerd dynamic configuration, schema version 1.
#
# This file replaces the previous per-platform containers.ini/nodes.ini files
# with a platform-decoupled service model and dynamic container placement.

version: 1

# Endpoint choices. Containers select one of these names with their endpoint field.
endpoints:
  - name: loopback
    host: 127.0.0.1

  - name: dual_board_motion
    host: 192.168.10.101

  - name: dual_board_perception
    host: 192.168.10.102

  - name: x5_single_board
    host: 192.168.127.101

  - name: x5_camera
    host: 192.168.127.10

# Containers are placement groups. They are disabled until explicitly enabled
# and assigned dynamically by a UI/API/runtime config revision.
containers:
  - name: motion
    enable: false
    endpoint: null
    properties_list:
      - dds_config
      - robot_model
    properties:
        dds_config: null
        robot_model: null

  - name: perception
    enable: false
    endpoint: null
    properties_list:
      - dds_config
      - robot_model
      - urdf_name
      - x5_camera_head_args
      - x5_camera_waist_args
    properties:
        dds_config: null
        robot_model: null
        urdf_name: null
        x5_camera_head_args: null
        x5_camera_waist_args: null

  - name: camera
    enable: false
    endpoint: null
    properties_list:
      - dds_config
      - robot_model
    properties:
        dds_config: null
        robot_model: null

  - name: agent
    enable: false
    endpoint: null
    properties_list:
      - dds_config
    properties:
        dds_config: null

# Dynamic property choices. Runtime/UI config chooses one value for each
# property and applies it to service templates.
container_properties:
  dds_config:
    - single-board_configs
    - dual-board_configs

  robot_model:
    - T1
    - K1
    - T2
    - T2_Hand

  urdf_name:
    - K1_22dof.urdf
    - T1_23dof.urdf
    - T1_29dof.urdf
    - T2_31dof.urdf

  x5_camera_head_args:
    - none
    - '--extract-left --compute-depth --depth-mode async --depth-interval 3 --rgb-interval 2 --engine stereo_k1_v1.0.0.trt'
    - '--extract-left --compute-depth --depth-mode async --depth-interval 1 --rgb-interval 1 --engine stereo_k1_v1.0.0.trt'
    - '--extract-left --compute-depth --depth-mode async --depth-interval 3 --rgb-interval 2 --engine stereo_t2_v1.0.0.trt'
    - '--extract-left --compute-depth --depth-mode async --depth-interval 1 --rgb-interval 1 --engine stereo_t2_v1.0.0.trt'
    - '--extract-left --compute-depth --depth-mode async --depth-interval 2 --rgb-interval 2 --engine stereo_t2_v1.0.0.trt'
    - '--extract-left  --rgb-interval 1 --engine stereo_t2_v1.0.0.trt'

  x5_camera_waist_args:
    - none
    - '--extract-left --compute-depth --depth-mode async --depth-interval 3 --rgb-interval 2 --engine stereo_k1_v1.0.0.trt'
    - '--extract-left --compute-depth --depth-mode async --depth-interval 1 --rgb-interval 1 --engine stereo_k1_v1.0.0.trt'
    - '--extract-left --compute-depth --depth-mode async --depth-interval 3 --rgb-interval 2 --engine stereo_t2_v1.0.0.trt'
    - '--extract-left --compute-depth --depth-mode async --depth-interval 1 --rgb-interval 1 --engine stereo_t2_v1.0.0.trt'
    - '--extract-left --compute-depth --depth-mode async --depth-interval 2 --rgb-interval 2 --engine stereo_t2_v1.0.0.trt'

services:
  - name: ros.robot_state_publisher
    enable: true
    container: motion
    exe: /opt/booster/bin/container/cli_wrapper
    args: 'ros2 launch /opt/booster/bin/script/launch/robot_state_publisher.launch.py'
    envs:
      FASTRTPS_DEFAULT_PROFILES_FILE: /opt/booster/config/dds_configs/${dds_config}/fastdds_profile_udp_only.xml
    cwd: /opt/booster/BoosterRos2
    user: root
    keepalive: true
    max_boot_retry: 3
    cpu_cores: "0,1,2,3"
    deps: []

  - name: ros.booster.rpc_bridge.motion
    enable: true
    container: motion
    exe: /opt/booster/bin/container/cli_wrapper
    args: 'ros2 launch booster_rpc_bridge rpc_bridge_launch_motion.py'
    envs:
      LD_LIBRARY_PATH: /opt/booster/ros2/booster_interface/lib
      FASTRTPS_DEFAULT_PROFILES_FILE: /opt/booster/config/dds_configs/${dds_config}/fastdds_profile_udp_only.xml
    cwd: /opt/booster/BoosterRos2
    user: root
    keepalive: true
    max_boot_retry: 3
    cpu_cores: "0,1,2,3"
    deps:
      - motion

  - name: ros.hand_ros2_bridge_left
    enable: true
    container: motion
    exe: /opt/booster/bin/container/cli_wrapper
    args: 'bash -c "/opt/booster/booster-x5-host-tools/ros-bridge-client/run.sh"'
    envs:
      X5_ROS_DISTRO: humble
      ROS_DOMAIN_ID: 0
      ROS_LOCALHOST_ONLY: 0
      CYCLONEDDS_URI: <CycloneDDS><Domain><General><Interfaces><NetworkInterface address="192.168.125.101"/></Interfaces></General></Domain></CycloneDDS>
      ZENOH_CONNECT_ENDPOINT: tcp/192.168.125.10:7447
      ZENOH_BRIDGE_CONFIG: /opt/booster/booster-x5-host-tools/ros-bridge-client/zenoh-left.json5
      X5_SSH_HOST: 192.168.125.10
      X5_TIME_SYNC_ENABLED: 1
      X5_TIME_SYNC_THRESHOLD_MS: 500
      X5_TIME_SYNC_INTERVAL_SEC: 1
      RUST_LOG: info
    cwd: /
    user: booster
    keepalive: true
    max_boot_retry: 3
    cpu_cores: "0,1,2,3"
    deps: []

  - name: ros.hand_ros2_bridge_right
    enable: true
    container: motion
    exe: /opt/booster/bin/container/cli_wrapper
    args: 'bash -c "/opt/booster/booster-x5-host-tools/ros-bridge-client/run.sh"'
    envs:
      X5_ROS_DISTRO: humble
      ROS_DOMAIN_ID: 0
      ROS_LOCALHOST_ONLY: 0
      CYCLONEDDS_URI: <CycloneDDS><Domain><General><Interfaces><NetworkInterface address="192.168.126.101"/></Interfaces></General></Domain></CycloneDDS>
      ZENOH_CONNECT_ENDPOINT: tcp/192.168.126.10:7447
      ZENOH_BRIDGE_CONFIG: /opt/booster/booster-x5-host-tools/ros-bridge-client/zenoh-right.json5
      X5_SSH_HOST: 192.168.126.10
      X5_TIME_SYNC_ENABLED: 1
      X5_TIME_SYNC_THRESHOLD_MS: 500
      X5_TIME_SYNC_INTERVAL_SEC: 1
      RUST_LOG: info
    cwd: /
    user: booster
    keepalive: true
    max_boot_retry: 3
    cpu_cores: "0,1,2,3"
    deps: []

  - name: ros.booster.rpc_bridge.perception
    enable: false
    container: perception
    exe: /opt/booster/bin/container/cli_wrapper
    args: 'ros2 launch booster_rpc_bridge rpc_bridge_launch_perception.py'
    envs:
      LD_LIBRARY_PATH: /opt/booster/ros2/booster_interface/lib
      FASTRTPS_DEFAULT_PROFILES_FILE: /opt/booster/config/dds_configs/${dds_config}/fastdds_profile_udp_only.xml
    cwd: /opt/booster/BoosterRos2
    user: root
    keepalive: true
    max_boot_retry: 3
    cpu_cores: "0,1,2,3"
    deps:
      - rtc_client
      - audio
      - lui

  - name: ros.booster.video_stream
    enable: true
    container: perception
    exe: /opt/booster/bin/container/cli_wrapper
    args: 'ros2 launch /opt/booster/bin/script/launch/booster_video_stream.launch.py'
    envs:
      FASTRTPS_DEFAULT_PROFILES_FILE: /opt/booster/config/dds_configs/${dds_config}/fastdds_profile.xml
    cwd: /opt/booster/BoosterRos2
