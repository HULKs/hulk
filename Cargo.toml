[patch.crates-io]
# Pinned to forked serde version since https://github.com/serde-rs/serde/pull/2513 is not merged
serde = { git = "https://github.com/HULKs/serde.git", rev = "ef30eb8fdd0ee12e4e6f3f5615c6bb022e02d1b2" }
# Pinned to forked serde version since https://github.com/serde-rs/serde/pull/2513 is not merged
serde_derive = { git = "https://github.com/HULKs/serde.git", rev = "ef30eb8fdd0ee12e4e6f3f5615c6bb022e02d1b2" }
# Pinned to forked serde version since https://github.com/serde-rs/serde/pull/2513 is not merged
serde_core = { git = "https://github.com/HULKs/serde.git", rev = "ef30eb8fdd0ee12e4e6f3f5615c6bb022e02d1b2" }
egui = { git = "https://github.com/HULKs/egui/", rev = "3db83369ad8ca00b215768b6f4e886d697abcb82" }
egui-wgpu = { git = "https://github.com/HULKs/egui/", rev = "3db83369ad8ca00b215768b6f4e886d697abcb82" }
emath = { git = "https://github.com/HULKs/egui/", rev = "3db83369ad8ca00b215768b6f4e886d697abcb82" }

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 16       # TODO: Evaluate performance for different values

[profile.with-debug]
inherits = "dev"
debug = true

[profile.debugger]
inherits = "with-debug"
opt-level = 0
