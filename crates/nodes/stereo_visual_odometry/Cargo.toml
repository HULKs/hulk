[package]
name = "stereo_visual_odometry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
color-eyre = { workspace = true }
coordinate_systems = { workspace = true }
kornia-3d = { workspace = true }
kornia-algebra = { workspace = true }
linear_algebra = { workspace = true }
nalgebra = { workspace = true }
ort.workspace = true
projection = { workspace = true }
ros-z = { workspace = true }
ros2 = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing = { workspace = true }
types = { workspace = true }

[dev-dependencies]
png = { workspace = true }
zip = { workspace = true }

[features]
default = ["ort-cuda-tensorrt"]
ort-cuda-tensorrt = ["ort/cuda", "ort/tensorrt"]
ort-dynamic = ["ort/load-dynamic"]
ort-webgpu = ["ort/webgpu"]

[[bench]]
name = "kitti_odometry"
harness = false
